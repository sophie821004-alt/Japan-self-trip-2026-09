<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SL Japan Trip 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="SL Japan 2026">
<meta name="theme-color" content="#141E33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#141E33; --indigo-2:#22304F; --verm:#C8352B; --gold:#B08321;
  --paper:#FFFFFF; --wash:#EFF2F7; --rule:#DCE2ED;
  --ink:#151A22; --ink-60:#5C6577; --ink-40:#8C94A3;
  --serif:"Noto Serif TC",'Songti TC','PingFang TC',serif;
  --sans:"Noto Sans TC",'PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);
  -webkit-font-smoothing:antialiased;padding-bottom:calc(74px + env(safe-area-inset-bottom))}

header.chrome{background:var(--indigo);color:#fff;position:relative;overflow:hidden;
  padding:calc(22px + env(safe-area-inset-top)) var(--pad) 18px}
header.chrome::after{content:"";position:absolute;right:-70px;top:-90px;width:220px;height:220px;
  border-radius:50%;background:var(--indigo-2)}
.eyebrow{position:relative;z-index:1;font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:700;margin-bottom:8px}
h1{position:relative;z-index:1;margin:0;font-family:var(--serif);font-weight:900;font-size:27px;letter-spacing:.02em;line-height:1.25}
.dates{position:relative;z-index:1;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:#93A1BC}
.now{position:relative;z-index:1;margin-top:14px;display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.09);border-radius:11px;padding:9px 12px;font-size:12.5px;color:#DDE4F1}
.now b{color:#fff;font-weight:700}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--verm);flex:none}

.days{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--rule);
  display:flex;gap:8px;overflow-x:auto;padding:11px var(--pad);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--rule);background:#fff;border-radius:999px;
  padding:7px 14px;font-size:12.5px;color:var(--ink-60);font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:7px;font-family:var(--sans)}
.pill b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.pill[aria-selected="true"]{background:var(--indigo);border-color:var(--indigo);color:#C8D2E6}
.pill[aria-selected="true"] b{color:#fff}
.pill.today::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--verm)}

main{padding:18px var(--pad) 26px;max-width:640px;margin:0 auto}
.dayhead{margin-bottom:16px}
.dayhead .kicker{font-family:var(--mono);font-size:11.5px;color:var(--verm);font-weight:700;letter-spacing:.08em}
.dayhead h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:5px 0 0;line-height:1.3}
.dayhead .meta{margin-top:7px;font-size:12px;color:var(--ink-60)}

.timeline{position:relative;margin-top:4px}
.timeline::before{content:"";position:absolute;left:51px;top:14px;bottom:22px;width:2px;background:var(--rule)}
.item{position:relative;display:grid;grid-template-columns:44px 1fr;gap:18px;padding-bottom:12px}
.item .time{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--ink-60);text-align:right;padding-top:15px}
.item .dot{position:absolute;left:47px;top:17px;width:10px;height:10px;border-radius:50%;
  background:var(--indigo);box-shadow:0 0 0 3px var(--wash);z-index:1}
.item.warn .dot{background:var(--verm)}
.card{background:var(--paper);border-radius:14px;padding:13px 15px;box-shadow:0 1px 2px rgba(20,30,51,.06)}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.45}
.card p{margin:5px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-60)}
.card p.flag{color:var(--verm);font-weight:500}
.tagrow{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#F6EFDC;color:var(--gold)}
.tag.r{background:#FAEBEA;color:var(--verm)}

.stay{margin-top:6px;display:flex;align-items:center;gap:9px;background:var(--indigo);
  color:#C8D2E6;border-radius:12px;padding:12px 15px;font-size:12.5px}
.stay b{color:#fff}
.stay.none{background:#FAEBEA;color:#8E241C}
.stay.none b{color:var(--verm)}
.foot{margin-top:14px;border-left:3px solid var(--gold);padding:2px 0 2px 12px;
  font-size:12px;line-height:1.65;color:var(--ink-60)}
.foot b{color:var(--gold)}

.tips{margin-top:14px;background:var(--paper);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,30,51,.06)}
.tips h4{margin:0 0 10px;font-family:var(--serif);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.tips h4 i{font-family:var(--serif);font-style:normal;font-size:11px;color:#fff;background:var(--verm);
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:700}
.tips ul{margin:0;padding:0;list-style:none}
.tips li{padding:7px 0;border-top:1px solid var(--rule);font-size:12.5px;line-height:1.6;color:var(--ink-60)}
.tips li:first-child{border-top:0;padding-top:0}
.tips li b{color:var(--ink);font-weight:700}
.progress{background:var(--indigo);border-radius:14px;padding:15px 16px;color:#fff;margin-bottom:18px}
.progress .n{font-family:var(--mono);font-size:26px;font-weight:700}
.progress .n span{font-size:14px;color:#8FA0BF}
.progress .lbl{font-size:11.5px;color:#8FA0BF;margin-top:2px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .35s ease}

.grouphead{font-family:var(--serif);font-weight:700;font-size:16px;margin:22px 0 10px;display:flex;align-items:baseline;gap:9px}
.grouphead:first-child{margin-top:0}
.grouphead small{font-family:var(--mono);font-size:11px;color:var(--ink-40);font-weight:500}

.get{position:relative;width:100%;text-align:left;border:0;cursor:pointer;font-family:var(--sans);
  background:var(--paper);border-radius:14px;padding:13px 78px 13px 15px;margin-bottom:9px;
  box-shadow:0 1px 2px rgba(20,30,51,.06);display:block}
.get .nm{font-size:14.5px;font-weight:700;line-height:1.45;color:var(--ink)}
.get .sub{font-size:12px;color:var(--ink-60);margin-top:4px;line-height:1.55}
.get .where{font-family:var(--mono);font-size:10.5px;color:var(--ink-40);margin-top:6px;letter-spacing:.03em}
.seal{position:absolute;right:14px;top:50%;width:54px;height:54px;margin-top:-27px;
  border:2.5px solid var(--verm);border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:19px;color:var(--verm);
  opacity:0;transform:rotate(-16deg) scale(1.5);transition:opacity .18s ease,transform .28s cubic-bezier(.2,1.4,.4,1)}
.seal::before{content:"";position:absolute;inset:4px;border:1px solid var(--verm);border-radius:50%;opacity:.55}
.get[aria-pressed="true"]{background:#FCF7F6}
.get[aria-pressed="true"] .nm{color:var(--ink-60)}
.get[aria-pressed="true"] .seal{opacity:.92;transform:rotate(-9deg) scale(1)}

/* ---- routes ---- */
.leg{background:var(--paper);border-radius:14px;padding:14px 15px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,30,51,.06)}
.leg .od{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700;line-height:1.4}
.leg .od span.ar{color:var(--ink-40);font-weight:400;flex:none}
.lines{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.ln{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  background:var(--wash);border-radius:7px;padding:4px 9px 4px 6px;color:var(--ink-60)}
.ln i{width:4px;height:14px;border-radius:2px;flex:none}
.legmeta{margin-top:10px;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--ink-40)}
.legmeta b{color:var(--ink);font-weight:700}
.legmeta a{margin-left:auto;color:var(--verm);font-family:var(--sans);font-size:11.5px;font-weight:700;text-decoration:none}
.leg p{margin:9px 0 0;font-size:12px;line-height:1.6;color:var(--ink-60)}
.leg p.flag{color:var(--verm);font-weight:500}

/* ---- info ---- */
.pass{background:var(--indigo);border-radius:16px;color:#fff;margin-bottom:12px;overflow:hidden}
.pass .top{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.pass .tag2{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.pass .no{font-family:var(--mono);font-size:15px;font-weight:700}
.pass .route{display:flex;align-items:flex-end;gap:12px;padding:0 16px 14px}
.pass .ap{flex:1}
.pass .ap.r{text-align:right}
.pass .code{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.pass .city{font-size:11px;color:#8FA0BF;margin-top:4px}
.pass .hm{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:6px}
.pass .mid{flex:none;padding-bottom:22px;color:#4E6091;font-size:15px}
.pass .strip{background:rgba(255,255,255,.08);display:flex;padding:11px 16px;gap:20px}
.pass .strip div{font-size:11px;color:#8FA0BF}
.pass .strip b{display:block;color:#fff;font-family:var(--mono);font-size:13.5px;font-weight:700;margin-top:3px}

.hotel{background:var(--paper);border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,30,51,.06)}
.hotel h4{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.hotel .zh{font-size:12px;color:var(--ink-40);margin-top:3px}
.hotel .nights{font-family:var(--mono);font-size:12px;color:var(--verm);font-weight:700;margin-top:9px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:7px 12px;font-size:12.5px;line-height:1.55;margin-top:11px}
.kv dt{color:var(--ink-40);font-weight:500}
.kv dd{margin:0;color:var(--ink)}
.kv dd a{color:var(--verm);text-decoration:none;font-weight:700}
.alert{background:#FAEBEA;border-radius:14px;padding:14px 16px;font-size:12.5px;line-height:1.65;color:#8E241C;margin-bottom:14px}
.alert b{color:var(--verm)}
.alert h4{margin:0 0 6px;font-size:14.5px;color:var(--verm)}
.note{background:var(--paper);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,30,51,.06)}
.note h4{margin:0 0 6px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.note h4 i{font-family:var(--mono);font-style:normal;font-size:11px;color:#fff;background:var(--gold);
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.note p{margin:0;font-size:12.5px;line-height:1.65;color:var(--ink-60)}
.hint{font-size:11px;color:var(--ink-40);line-height:1.6;margin:14px 0 0}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:11px 0 12px;cursor:pointer;font-family:var(--sans);
  font-size:11px;font-weight:700;color:var(--ink-40);display:flex;flex-direction:column;align-items:center;gap:5px}
.tabbar button .ic{font-family:var(--serif);font-size:17px;line-height:1;font-weight:700}
.tabbar button[aria-selected="true"]{color:var(--verm)}


/* ---- segmented + map ---- */
.seg{display:flex;gap:5px;background:var(--rule);border-radius:11px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink-60)}
.seg button[aria-selected="true"]{background:var(--indigo);color:#fff}
.mapwrap{position:relative;background:#fff;border-radius:14px;overflow:hidden;
  height:calc(100vh - 260px);min-height:340px;touch-action:none;box-shadow:0 1px 2px rgba(20,30,51,.06)}
.mapwrap img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;
  user-select:none;-webkit-user-drag:none;will-change:transform}
.mapctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:38px;height:38px;border-radius:11px;border:0;cursor:pointer;
  background:rgba(20,30,51,.86);color:#fff;font-family:var(--mono);font-size:15px;font-weight:700}
.mapctl button.rs{font-family:var(--sans);font-size:11px}
.maptip{margin:10px 0 0;font-size:11px;color:var(--ink-40);line-height:1.6;text-align:center}
.mapempty{background:var(--paper);border-radius:14px;padding:26px 20px;text-align:center;
  box-shadow:0 1px 2px rgba(20,30,51,.06)}
.mapempty h4{margin:0 0 8px;font-family:var(--serif);font-size:16px}
.mapempty p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-60)}
.mapempty code{font-family:var(--mono);font-size:11.5px;background:var(--wash);
  padding:2px 6px;border-radius:5px;color:var(--verm)}
.mapempty a{color:var(--verm);font-weight:700;text-decoration:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--verm);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>

<header class="chrome">
  <div class="eyebrow">東京 · 鎌倉 · 江之島 · 橫濱</div>
  <h1>強運與寶可夢尋寶</h1>
  <div class="dates">2026.09.28 MON — 10.03 SAT　·　NH854 / NH853</div>
  <div class="now"><span class="pulse"></span><span id="nowline">行前準備中</span></div>
</header>

<nav class="days" id="days" role="tablist" aria-label="選擇日期"></nav>

<main>

  <div id="view-collect" hidden></div>
  <div id="view-info" hidden></div>

<nav class="tabbar" role="tablist" aria-label="切換頁面">
  <button data-tab="plan" aria-selected="true"><span class="ic">程</span>行程</button>
  <button data-tab="route" aria-selected="false"><span class="ic">路</span>路線</button>

  <button data-tab="info" aria-selected="false"><span class="ic">訊</span>資訊</button>
</nav>

<script>

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

  ["芝大神宮 御朱印","500 円，授與 9:00–17:00，會附贈生姜糖，因為這裡的例大祭又叫生姜祭。"],
  ["東京車站逛街","增上寺一帶入夜幾乎沒有店，逛街留到東京車站。GRANSTA 在站內 B1–1F，伴手禮、和菓子、雜貨都有；KITTE 是舊東京中央郵局改建，選品與文具比較有質感，20:00 關。"],
  ["Depot 布丁","GranSta 票選第一名的懷舊苦味布丁，焦糖用自家烘焙的義式濃縮做的。黑膠唱盤配昭和喫茶氛圍，是咖啡吧不是甜點店，晚上去比較對味。每人須點一杯飲料。"],
  ["出世地藏尊 根付","社務所販售根付的時間只有 11:00–12:00 與 13:00–15:00，所以排在早上。參拜本身跟著百貨營業，10:00–20:00 都可以。"],
  ["地藏堂 御開帳","堂門平常是關著的，只有每月 7 日（遇六日提前到週五）和 4、10 月例大祭才開。9/29 看不到本尊，在堂外參拜。"],
  ["三囲神社","地藏尊旁邊，三越前身三井家的守護神，從向島本社分靈的稻荷神，求商賣繁盛。順便一起拜。"],
  ["增上寺 為什麼移到晚上","大殿與德川將軍家墓所 16:00–17:00 就關，但境內夜間開放通行。18:00 從大殿往上拍打燈的東京鐵塔是經典角度，中午省下的時間留給御朱印帳。"],
  ["芝大神宮 千木筥","職人手工的良緣緣起物，高約 12 公分，裡面裝紅豆搖起來會響。現已全年授與，但缺貨時要等下一批。"]

/* ---- 可縮放地圖 ---- */
let fitMap = ()=>{};
function initMap(){
  const wrap = $("#mapwrap"), img = $("#mapimg"), empty = $("#mapempty");
  let base = 1, sc = 1, tx = 0, ty = 0, ready = false;
  const apply = ()=>{ img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  function clamp(){
    const w = img.naturalWidth*sc, h = img.naturalHeight*sc;
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    tx = w <= cw ? (cw-w)/2 : Math.min(0, Math.max(cw-w, tx));
    ty = h <= ch ? (ch-h)/2 : Math.min(0, Math.max(ch-h, ty));
  }
  function reset(){
    if(!img.naturalWidth) return;
    base = Math.min(wrap.clientWidth/img.naturalWidth, wrap.clientHeight/img.naturalHeight);
    sc = base; tx = 0; ty = 0; clamp(); apply();
  }
  fitMap = ()=>{ if(ready) reset(); };
  function zoom(f, cx, cy){
    const ns = Math.min(base*10, Math.max(base, sc*f));
    const r = ns/sc;
    tx = cx-(cx-tx)*r; ty = cy-(cy-ty)*r; sc = ns; clamp(); apply();
  }
  img.addEventListener("load", ()=>{ ready = true; wrap.hidden = false; empty.hidden = true; reset(); });
  img.addEventListener("error", ()=>{ wrap.hidden = true; empty.hidden = false; });
  if(img.complete){
    if(img.naturalWidth){ ready = true; reset(); }
    else { wrap.hidden = true; empty.hidden = false; }
  }

  const rect = ()=>wrap.getBoundingClientRect();
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  let last = null, d0 = 0, mid = null, tapAt = 0;

  wrap.addEventListener("touchstart", e=>{
    if(e.touches.length === 1){
      last = {x:e.touches[0].clientX, y:e.touches[0].clientY}; d0 = 0;
      const now = Date.now();
      if(now - tapAt < 300){ reset(); tapAt = 0; } else { tapAt = now; }
    }else if(e.touches.length === 2){
      const r = rect();
      d0 = dist(e.touches); last = null;
      mid = {x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,
             y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top};
    }
  }, {passive:true});

  wrap.addEventListener("touchmove", e=>{
    if(!ready) return;
    e.preventDefault();
    if(e.touches.length === 1 && last){
      tx += e.touches[0].clientX-last.x; ty += e.touches[0].clientY-last.y;
      last = {x:e.touches[0].clientX, y:e.touches[0].clientY};
      clamp(); apply();
    }else if(e.touches.length === 2 && d0){
      const d1 = dist(e.touches);
      zoom(d1/d0, mid.x, mid.y); d0 = d1;
    }
  }, {passive:false});

  wrap.addEventListener("wheel", e=>{
    if(!ready) return;
    e.preventDefault();
    const r = rect();
    zoom(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});

  wrap.querySelector(".mapctl").addEventListener("click", e=>{
    const b = e.target.closest("[data-z]"); if(!b || !ready) return;
    const cw = wrap.clientWidth/2, ch = wrap.clientHeight/2;
    if(b.dataset.z === "in") zoom(1.6, cw, ch);
    else if(b.dataset.z === "out") zoom(1/1.6, cw, ch);
    else reset();
  });

  window.addEventListener("resize", ()=>{ if(ready && !$("#sub-map").hidden) reset(); });
}

    <div class="note"><h4><i>食</i>洋食の店 クロンボ</h4><p>9/30 (三) 午餐。高圓寺南 4-49-1，高架橋下步行 3–4 分。昭和洋食老店，漢堡排、可樂餅、炸豬排，套餐含白飯味噌湯 750 円起。<b>門口食券機要先看樣品選好再進去</b>，店內沒有菜單。11:00–20:00，每天營業。電話 +81 3-3339-1710。</p></div>
    <div class="note"><h4><i>食</i>しらすや 腰越</h4><p>10/2 (五) 午餐。腰越 2-10-13，腰越站步行 1 分。吻仔魚專門店，生、釜揚、天婦羅、可樂餅一次上桌。11:00–21:00，<b>週四公休</b>（10/2 週五有開）。電話 +81 467-33-0363。</p></div>
    <div class="note"><h4><i>食</i>うま囲 藤澤站南口店</h4><p>10/1 (四) 晚餐。南藤沢 3-4 湘南薬品南藤沢ビル 7F，飯店步行 3 分。牛舌、馬肉刺身，<b>有英文菜單、包廂座</b>。每天 17:00–24:00，不用訂位多半有位。電話 +81 466-25-5150。</p></div>
    <div class="note"><h4><i>約</i>人形町今半 上野廣小路店</h4><p>9/29 (二) <b>13:15 報到、13:30 入座</b>，大廳開放式座席，1 名。餐點是不含生魚片的壽喜燒定食（特上）¥11,088。訂單 606020 已完成付款。上野廣小路ビル 6F，電話 +81 3-5688-0754。</p></div>

    <div class="note"><h4><i>日</i>日落時間</h4><p>10/1 約 17:25、10/2 約 17:23。江之島與橫濱的夕陽都要在這之前到位。</p></div>`;
}
function renderNow(){
  const ti = todayIndex(), t = new Date();
  let txt;
  if(ti < 0){
    const diff = Math.ceil((new Date("2026-09-28T00:00:00") - t)/86400000);
    txt = diff > 0 ? `出發倒數 <b>${diff}</b> 天` : "旅程已結束，辛苦了";
  }else{
    const d = DAYS[ti];
    const hhmm = String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    const next = d.items.find(i => i.t > hhmm);
    txt = next ? `Day ${d.n} · 下一站 <b>${esc(next.a)}</b> ${next.t}` : `Day ${d.n} · 今天的行程都跑完了`;
  }
  $("#nowline").innerHTML = txt;
}

$("#days").addEventListener("click", e=>{
  const b = e.target.closest(".pill"); if(!b) return;
  current = +b.dataset.i; renderPills(); renderPlan();
  window.scrollTo({top:0,behavior:"smooth"});
});
$("#view-collect").addEventListener("click", e=>{
  const b = e.target.closest("[data-get]"); if(!b) return;
  const k = "get:"+b.dataset.get, on = store.get(k)==="1";
  store.set(k, on ? "0" : "1");
  b.setAttribute("aria-pressed", String(!on));
  const total = COLLECT.reduce((a,g)=>a+g.items.length,0);
  const done = COLLECT.flatMap(g=>g.items).filter(i=>store.get("get:"+i.id)==="1").length;
  $(".progress .n").innerHTML = `${done}<span> / ${total}</span>`;
  $(".bar i").style.width = Math.round(done/total*100)+"%";
});
document.querySelectorAll(".tabbar button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected", String(b===btn)));
    const tab = btn.dataset.tab;
    ["plan","route","collect","info"].forEach(t=>{ $("#view-"+t).hidden = (t!==tab); });
    $("#days").style.display = tab==="plan" ? "flex" : "none";
    if(tab==="collect") renderCollect();
    window.scrollTo({top:0});
  });
});

const ti0 = todayIndex();
current = ti0 >= 0 ? ti0 : 0;
renderPills(); renderPlan(); renderRoute(); renderCollect(); renderInfo(); renderNow();
setInterval(renderNow, 60000);
</script>
